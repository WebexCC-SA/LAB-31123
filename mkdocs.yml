---
site_name: "LAB-31123: Troubleshoot and Manage Your Organization with an AI Assistant"
site_description: "LAB-31123: Building an AI Assistant to Manage and Troubleshoot Your Organization"
site_author: Diego Manuel Jimenez Moreno
copyright: Copyright &copy; 2026 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/WebexCC-SA/LAB-31123.git"
  site_event: WebexOne 2026
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
plugins:
  - search
  - macros
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
      - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Lab:
      - Welcome: welcome.md
      - Overview: overview.md
      - Getting Started: getting_started.md
      #- Lab 1 - AI Assistants and Architecture: lab2_ai-assistant-and-architecture.md
      #- Lab 2 - MCP Fundamentals: lab3_mcp-fundamentals.md
      - Lab 1 - Webex MCP Servers in Your IDE: lab1_webex-mcp-in-ide.md
      - Lab 2 - Webex APIs: lab2_webex-apis-troubleshooting.md
      - Lab 3 - Integrate an AI Assistant with a Webex Bot: lab3_bot-integration.md
      - Lab 4 - MCP Servers in AI Assistant: lab4_mcp.md
      - Lab 5 - Agent Skills: lab7_agent-skills.md
      - Lab 6 - Build a Custom MCP Server: lab8_custom-mcp-server.md
      - Lab 7 - RAG: lab7_rag.md
      - Exercises: exercises.md
      #- Lab 6 - Capstone Troubleshooting Workflow: lab9_capstone-workflow.md
      - Conclusion: conclusion.md
